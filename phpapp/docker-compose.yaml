services:
  web-server:
    image: nginx:alpine
    container_name: website-web-server-1
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html
      - ./php:/var/www/html/php
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - php
    networks:
      - zapnet
 
  php:
    image: php:8.2-fpm-alpine
    container_name: website-php-1
    volumes:
      - ./html:/var/www/html
      - ./php:/var/www/html/php
    networks:
      - zapnet
 
  zap-scanner:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: website-zap-scanner-1
    command: sleep infinity
    networks:
      - zapnet
 
networks:
  zapnet:
    driver: bridge
 