
services:
  web-server:
    image: nginx:alpine
    container_name: website-web-server-1
    ports:
      - "8080:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - zapnet

  zap-scanner:
    image: ghcr.io/zaproxy/zaproxy:stable
    container_name: website-zap-scanner-1
    command: sleep infinity
    networks:
      - zapnet

networks:
  zapnet:
    driver: bridge